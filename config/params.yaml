# Todas as premissas numéricas do projeto. Nenhum número mágico vive no
# código (CLAUDE.md, seção 2) -- ele vive aqui, comentado, para que a lista
# de premissas assumidas da Sprint 17 não precise ser reconstruída na unha.
#
# Todo valor marcado "arbitrado" é um chute plausível, não uma medida do
# negócio real. Cada um desses precisa ser revisto com o cliente antes do
# relatório final.

data:
  raw_dir: data/raw/favorita # decidido na Sprint 2: layout real do dataset Favorita bruto
  raw_parquet_dir: data/raw_parquet/favorita # decidido na Sprint 2: parquet bruto, sem transformação (motor.io.raw)
  canonical_dir: data/canonical/favorita # decidido na Sprint 3: layout real de saída de motor.io.loaders
  start_date: 2013-01-01 # cobertura do dataset público Favorita
  end_date: 2017-08-15 # idem

profiling:
  # Duas janelas candidatas para a Sprint 4 escolher o subconjunto de trabalho.
  # Nenhuma é "a" janela -- o ponto é tornar visível, em número, o trade-off
  # entre as duas (CLAUDE.md seção 8: decisão de modelagem que muda resultado
  # financeiro para, aqui, resultado de seleção -- não escolho sozinho).
  windows:
    # medido (profile_promo_availability contra o dado real, Sprint 2): onpromotion
    # é 100% nulo até 2014-03 e cai para 0% nulo a partir de 2014-04-01, sem mês de
    # transição parcial -- as duas janelas abaixo já têm promoção 100% utilizável.
    # O que as diferencia de fato não é mais promoção, e sim o terremoto do Equador
    # de 16/04/2016 (a documentação do dataset registra distorção de vendas por
    # várias semanas): a janela de 12 meses o evita inteiramente, a de 24 meses o
    # inclui em troca de mais histórico.
    - name: ultimos_12_meses
      start: 2016-08-16
      end: 2017-08-15
    - name: ultimos_24_meses
      start: 2015-08-16
      end: 2017-08-15
  density_cuts: [0.5, 0.6, 0.7, 0.8, 0.9, 0.95] # arbitrado: grade de corte para count_candidates

subset_selection:
  # Sprint 4, Fase A -- todo valor abaixo vem do relatório de medição (M1-M7),
  # não de arbitragem. D1-D8 se referem às decisões desse relatório.
  store_id: "44" # D1, medido: maior volume (33,1M un. vs. mediana 8,9M), histórico
    # cobre a janela inteira, 0,55% dias não-operacionais, tipo A (segmento com
    # 9 lojas -- não é um caso único do dataset)
  n_stores: 1 # uma loja, conforme CLAUDE.md seção 9 (Sprint 0)
  n_items_min: 150 # piso do intervalo pedido no CLAUDE.md
  n_items_max: 300 # teto do intervalo pedido no CLAUDE.md
  min_weeks_of_history: 52 # usado para derivar simulation.start_date (D2) e o fim de density_window (D3)
  # D3: fatia em que densidade é medida -- estritamente ANTES de simulation.start_date,
  # nunca o período avaliado (contrato fixo da função `select_subset`, não argumento).
  # density_window_start = canonical.window_start; density_window_end = simulation.start_date - 1 dia
  # (= canonical.window_start + min_weeks_of_history*7 dias - 1).
  density_window_start: 2015-08-16
  density_window_end: 2016-08-13
  density_threshold: 0.9 # D3, medido (M2): piso que separa demanda regular de intermitente nesta loja
  promo_days_max_share: 0.5 # D6, medido (M6): só 6 itens cruzam esse piso -- item dominado por promoção, excluído
  family_min_items: 3 # D6, medido (M5): abaixo disso, fornecedor com <=2 itens degenera a regra de pedido mínimo
  family_cap: 20 # D5 ⚠️ decidido, não medido: cap por família -- gera N final ~260-280 (dentro de 150-300)

simulation:
  warmup_days: 90 # arbitrado: ~3 meses para o estoque inicial deixar de contaminar a métrica
  # Corrigido na Sprint 4 (D2): os valores antigos (start_date=2013-04-01) são de
  # antes do Sprint 3 recortar o canônico para a janela de 24 meses abaixo -- não
  # existe dado antes de canonical.window_start (2015-08-16). start_date agora é
  # derivado: canonical.window_start + min_weeks_of_history*7 dias (364, o
  # histórico mínimo de treino do forecaster) = onde o LOOP do simulador começa.
  start_date: 2016-08-14
  # evaluation_start_date = start_date + warmup_days (90) -- só a partir daqui a
  # métrica financeira conta (CLAUDE.md seção 6: warmup é simulado, não medido).
  # Restam (canonical.window_end - evaluation_start_date) = 277 dias (~9 meses)
  # de fato avaliados.
  evaluation_start_date: 2016-11-12
  end_date: 2017-08-15 # = canonical.window_end
  seed: 42 # arbitrado: qualquer inteiro fixo serve, o que importa é ser fixo

forecast_naive:
  # Sprint 7: motor.forecast.naive.NaiveForecaster. moving_average_weeks é
  # compartilhado com motor.policy.erp_baseline.ErpBaselinePolicy (ver
  # comentário no topo de erp_baseline.py) -- não é calibrado, é fixado pelo
  # enunciado da sprint ("média das últimas 4 semanas").
  moving_average_weeks: 4
  min_residual_samples: 8 # arbitrado: piso para o backtest de resíduos não degenerar com poucas amostras

forecast_statistical:
  # Sprint 12: motor.forecast.statistical.StatisticalForecaster. Nível recente
  # deseasonalizado x índice de sazonalidade semanal (7 índices, por dia ISO),
  # quantis empíricos dos resíduos do próprio backtest -- ver docstring do
  # módulo para o modelo completo e para o cuidado com vazamento por feature
  # global (índice sazonal recalculado a cada candidato de backtest, nunca
  # uma vez só sobre o histórico inteiro).
  #
  # Os três valores abaixo são INDEPENDENTES de forecast_naive -- este modelo
  # não precisa concordar com nenhuma política sobre o tamanho de janela
  # (ao contrário de moving_average_weeks, que ErpBaselinePolicy também lê).
  level_window_weeks: 4 # arbitrado: mesma escala do naive para o nível recente, sem acoplar aos dois
  seasonal_window_weeks: 12 # arbitrado: ~3 meses, dá >=12 ocorrências de cada dia da semana sem ficar velho demais
  min_residual_samples: 8 # arbitrado: mesmo piso do naive para o backtest de resíduos não degenerar

erp_baseline:
  # Sprint 7: motor.policy.erp_baseline.ErpBaselinePolicy. Calibração medida
  # sobre dado real (não chutada) -- critério, grade e decisão registrados
  # por escrito abaixo, conforme pedido no enunciado da sprint.
  #
  # CRITÉRIO (aprovado na revisão, não escolhido sozinho -- CLAUDE.md seção
  # 10): nível de serviço = fill rate agregada (sum(sold)/sum(demand) sobre
  # todo o subconjunto, medida só no período pós-warmup) >= 95%. Entre as
  # configurações que atingem a meta, escolhe a de menor estoque médio
  # agregado (avg_on_hand); se nenhuma atingisse, escolheria a de maior fill
  # rate e marcaria target_met=False -- não foi o caso aqui.
  #
  # JANELA DE CALIBRAÇÃO: subset_selection.density_window_start..end
  # (2015-08-16 a 2016-08-13) -- termina exatamente onde simulation.start_date
  # começa, sem overlap com o período avaliado pelos braços de verdade.
  # warmup_days (90, igual ao dos braços) descartado da leitura da métrica.
  #
  # GRADE ORIGINAL (aprovada na revisão): factor em [1.0..2.0] passo 0.1,
  # min_order_units em [0,1,3,5,10] (275 itens do subconjunto real, loja 44).
  # RESULTADO: platô integral -- a borda inferior (factor=1.0) já batia
  # fill_rate=99.63%, a borda superior (factor=2.0) batia 99.86%. A escolha
  # caía sempre na borda inferior só porque a grade nunca alcançou o ponto
  # onde o nível de serviço cai abaixo da meta -- não é calibração de
  # verdade, é o teto da grade (achado no CHECK do ajuste 2 da revisão).
  # Grade ampliada pra baixo por decisão da revisão, não escolha própria.
  #
  # GRADE FINAL: factor em [0.1, 0.2, 0.28, 0.30, 0.32, 0.34, 0.36, 0.38,
  # 0.40, 0.5, 0.6, 0.7, 0.8, 0.9, 1.0, 1.1, ..., 2.0] -- passo 0.02 entre
  # 0.28 e 0.40 (onde a curva cruza a meta), passo 0.1 no resto; mesma grade
  # de min_order_units. Não refinada além de passo 0.02: o ganho de precisão
  # é menor que a incerteza das premissas arbitradas (estoque inicial,
  # ausência de shelf life) -- refinar mais seria falsa precisão.
  #
  # ESCOLHIDO: factor=0.34 (fill_rate=95.98%, avg_on_hand=129.75 unidades
  # agregadas, pós-warmup). Vizinhas na grade: factor=0.32 (fill_rate=94.44%,
  # abaixo da meta) e factor=0.36 (fill_rate=97.01%, acima, com mais
  # estoque). O ótimo fica no MEIO da grade ampliada, não numa borda; a curva
  # sobe ~1.3-1.5 p.p. de fill_rate a cada passo de 0.02 nessa faixa -- não
  # está plana. Confirma que a grade final está bem posicionada.
  #
  # MIN_ORDER_UNITS: varrido em [0,1,3,5,10] em toda a grade de factor, sem
  # efeito mensurável -- fill_rate e avg_on_hand empatam em 4 casas decimais
  # em cada ponto de factor, para os 5 valores de min_order_units. CHECK 1 da
  # revisão: em vez de aceitar isso como coincidência, instrumentei uma
  # rodada real (factor=0.34, min_order_units=10, todo o subconjunto, janela
  # pós-warmup) contando ativações do piso decisão a decisão. Resultado: o
  # piso ATIVOU 22 vezes em 10.668 decisões com pedido bruto > 0 (~0.2%) --
  # não é bug de propagação (um bug de propagação daria zero ativações, não
  # 22). É que a mediana de pedido bruto nessas decisões é ~114 unidades
  # (p10=45, p90=430), contra um piso testado de no máximo 10 -- o piso quase
  # nunca morde nesta escala de demanda. Fixado em 0.0: não há evidência
  # medida que justifique um valor > 0; um piso "de bom senso" sem essa
  # medição teria sido exatamente o número mágico que a sprint pediu pra
  # evitar.
  factor: 0.34
  min_order_units: 0.0

  # CHECK 2 da revisão -- o que factor=0.34 significa em dias de cobertura:
  # factor(0.34) x forecast_naive.moving_average_weeks(4) x 7 dias = 9,52
  # dias de cobertura-alvo. lead_time_days e review_period_days do
  # subconjunto real são 3 e 7 -- uniformes nos 16 fornecedores do
  # subconjunto (confirmado, não assumido) porque vêm do default de
  # supplier_assumptions, não de um calendário de fornecedor medido (o
  # Favorita não tem esse dado) -- logo L+R = 10 dias, não 11. Razão
  # cobertura/(L+R) = 9,52/10 = 0,952: o baseline calibrado converge pra
  # PERTO da própria janela de risco, não erra a cobertura por uma margem
  # grande.
  #
  # LIMITAÇÃO/CONTEXTO DO RESULTADO, não detalhe de implementação: como o
  # baseline calibrado já cobre quase toda a janela de risco em dias, o
  # ganho esperado dos braços 2 e 3 sobre este baseline NÃO deve vir de
  # "corrigir uma cobertura errada em dias" -- o baseline não erra isso de
  # forma grosseira nesta calibração. Tem que vir de onde o baseline é
  # estruturalmente cego: reagir à FORMA da distribuição de demanda (previsão
  # quantílica por item, em vez de um fator plano igual pra toda a base) e
  # das regras de guarda. Se os braços futuros não superarem este baseline, a
  # pergunta certa é se a previsão quantílica está de fato capturando risco
  # que a média móvel não vê -- não se este baseline está artificialmente
  # ruim.

supplier_assumptions:
  default_pack_multiple: 1.0 # arbitrado: sem fardo conhecido, assume unidade avulsa
  default_lead_time_days: 3 # arbitrado: prazo comum de fornecedor de mercearia local
  default_review_period_days: 7 # arbitrado: revisão semanal como piso, ver Supplier.review_period_days
  default_min_order_value: 0.0 # arbitrado: sem pedido mínimo conhecido, não restringe
  default_min_order_units: 0.0 # arbitrado (Sprint 10): sem mínimo em unidades conhecido, não restringe
  default_order_weekdays: [1, 2, 3, 4, 5] # arbitrado: sem calendário real de fornecedor, assume todo dia útil (Sprint 3, D8)

supplier_order_policy:
  # Sprint 10: motor.policy.supplier.apply_supplier_constraints. Teto GLOBAL
  # (somado sobre todos os itens do fornecedor, não por item) de fardos
  # adicionais no preenchimento até o pedido mínimo -- estourar o teto sem
  # atingir o mínimo adia o pedido inteiro (MINIMO_INATINGIVEL).
  max_additional_packs_for_minimum: 10 # arbitrado: piso plausível antes de considerar o mínimo inatingível

# Sprint 17, Etapa 3.15 -- SÓ para motor.reporting.purchase_list. NÃO usado
# por motor.io.loaders nem por nenhum resultado de experiments/iso_service
# (canônico e todo o resto do projeto continuam com pack_multiple=1,0 e
# min_order=0,0, arbitrados como default mais simples -- ver EconomicsParams
# e a nota em motor.assumptions). O canônico Favorita não tem fardo nem
# pedido mínimo reais; com os dois zerados, apply_supplier_constraints nunca
# tinha chance de disparar suas próprias regras, o que esvaziava a lista de
# compra como peça de venda. Origem real destas regras (documento de
# negócio): entrevista de onboarding com o fornecedor, não o ERP.
purchase_list_supplier_assumptions:
  # Fardo por família (arbitrado, prática de varejo brasileiro, sem medição):
  pack_multiple_by_category:
    # perecível fresco vendido a peça/peso -- sem fardo real
    PRODUCE: 1.0
    MEATS: 1.0
    POULTRY: 1.0
    SEAFOOD: 1.0
    DELI: 1.0
    # giro rápido, fardo pequeno
    "BREAD/BAKERY": 6.0
    DAIRY: 6.0
    EGGS: 6.0
    "FROZEN FOODS": 6.0
    "PREPARED FOODS": 6.0
    # mercearia seca / limpeza / higiene, fardo padrão
    "GROCERY I": 12.0
    "GROCERY II": 12.0
    CLEANING: 12.0
    "PERSONAL CARE": 12.0
    "HOME CARE": 12.0
    "BABY CARE": 12.0
    # bebidas, logística de pallet fechado
    BEVERAGES: 24.0
    "LIQUOR,WINE,BEER": 24.0
    # bazar / não-alimentar, fardo pequeno (as 15 categorias restantes)
    "HOME AND KITCHEN I": 6.0
    "HOME AND KITCHEN II": 6.0
    CELEBRATION: 6.0
    "LAWN AND GARDEN": 6.0
    LADIESWEAR: 6.0
    LINGERIE: 6.0
    AUTOMOTIVE: 6.0
    BEAUTY: 6.0
    "PLAYERS AND ELECTRONICS": 6.0
    "SCHOOL AND OFFICE SUPPLIES": 6.0
    "PET SUPPLIES": 6.0
    MAGAZINES: 6.0
    HARDWARE: 6.0
    BOOKS: 6.0
    "HOME APPLIANCES": 6.0
  # R$ 2.000,00 para categoria com MENOS DE 50 itens no canônico completo
  # (proxy de fornecedor pequeno/especializado -- entrega dedicada não se
  # paga sozinha em volume baixo); R$ 0,00 para as demais (alto volume,
  # entrega já frequente e justificada por si). Critério calculado uma vez
  # sobre o canônico (ver docstring de PurchaseListSupplierAssumptionsParams);
  # valores congelados aqui, não recalculados em runtime.
  min_order_value_by_category:
    # >= 50 itens no canônico -- sem mínimo
    "GROCERY I": 0.0
    BEVERAGES: 0.0
    CLEANING: 0.0
    PRODUCE: 0.0
    DAIRY: 0.0
    "PERSONAL CARE": 0.0
    "BREAD/BAKERY": 0.0
    "HOME CARE": 0.0
    DELI: 0.0
    MEATS: 0.0
    "HOME AND KITCHEN I": 0.0
    "LIQUOR,WINE,BEER": 0.0
    "FROZEN FOODS": 0.0
    POULTRY: 0.0
    # < 50 itens no canônico -- pedido mínimo de R$ 2.000,00
    "HOME AND KITCHEN II": 2000.0
    EGGS: 2000.0
    CELEBRATION: 2000.0
    "PREPARED FOODS": 2000.0
    "LAWN AND GARDEN": 2000.0
    LADIESWEAR: 2000.0
    LINGERIE: 2000.0
    AUTOMOTIVE: 2000.0
    BEAUTY: 2000.0
    "PLAYERS AND ELECTRONICS": 2000.0
    "SCHOOL AND OFFICE SUPPLIES": 2000.0
    "GROCERY II": 2000.0
    "PET SUPPLIES": 2000.0
    SEAFOOD: 2000.0
    MAGAZINES: 2000.0
    HARDWARE: 2000.0
    "BABY CARE": 2000.0
    BOOKS: 2000.0
    "HOME APPLIANCES": 2000.0

economics:
  capital_cost_annual: 0.15 # arbitrado: custo de capital anualizado plausível para varejo pequeno/médio no Brasil
  # Sprint 8: preço único por unidade vendida, aplicado a TODO item -- o Favorita não
  # tem preço em nenhuma linha do bruto, e margem percentual sozinha não converte pra
  # R$. A escala deste número é PROVADAMENTE irrelevante pra métrica ordenadora e pro
  # giro (motor.metrics.financial, docstring do módulo, tem a prova algébrica -- price
  # cancela porque é uniforme entre itens) -- só o tamanho dos R$ absolutos reportados
  # (margem_realizada_rs, capital_medio_rs) escala com ele. NUNCA leia esses dois como
  # valor monetário real -- só as razões (decision_metric, giro_anualizado) importam.
  # Ver "Limitações" na docstring de motor.metrics.financial para o que essa escolha
  # esconde (distorção de ordenação POR ITEM, equivalência kg/unidade).
  uniform_unit_price: 10.00
  default_margin_pct: 0.25 # arbitrado: fallback para categoria não mapeada em category_margin_pct
  category_margin_pct:
    # Margem por categoria REAL do Favorita (Sprint 8) -- chaves trocadas das buckets
    # genéricas (hortifruti/mercearia/bebidas/limpeza) pelos valores reais de
    # Item.category no subconjunto de trabalho (16 categorias, loja 44). Só a linha
    # GROCERY I/II vem do documento de negócio (mercearia seca, faixa 15-22%, ponto
    # médio) -- todo o resto é ARBITRADO POR ANALOGIA com varejo brasileiro, sem
    # medição nenhuma. Escrito assim de propósito, sem suavizar (revisão da Sprint 8).
    #
    # Item âncora (arroz, leite, açúcar, refrigerante -- faixa <8% no documento de
    # negócio) NÃO está separado aqui: Item.is_anchor é 100% nulo no canônico, e o
    # Sprint 3 decidiu explicitamente não inventar um proxy (por volume, por exemplo)
    # que atribuiria significado de negócio que o dado não carrega. Adiado pra quando
    # is_anchor tiver um consumidor real (Sprint 13) -- ver limitação na docstring de
    # motor.metrics.financial.
    "GROCERY I": 0.18 # documento de negócio: mercearia seca, faixa 15-22%, ponto médio
    "GROCERY II": 0.18 # idem
    MEATS: 0.14 # arbitrado por analogia -- proteína crua, menor margem típica do varejo BR
    POULTRY: 0.14 # idem
    SEAFOOD: 0.14 # idem
    DAIRY: 0.17 # arbitrado por analogia
    EGGS: 0.17 # idem
    DELI: 0.22 # arbitrado por analogia -- frios/processados, margem intermediária
    PRODUCE: 0.20 # arbitrado (valor já usado antes da Sprint 8, mantido)
    "BREAD/BAKERY": 0.32 # arbitrado por analogia -- padaria própria, margem alta típica
    "FROZEN FOODS": 0.26 # arbitrado por analogia
    BEVERAGES: 0.30 # arbitrado (valor já usado antes da Sprint 8, mantido)
    CLEANING: 0.30 # arbitrado por analogia (ajustado de 0.28 antes da Sprint 8)
    "HOME CARE": 0.30 # idem
    "PERSONAL CARE": 0.36 # arbitrado por analogia -- higiene/beleza, margem alta típica
  default_alpha: 0.90 # arbitrado: nível de serviço-alvo (quantil de risco) default -- é
    # este valor, sozinho, que motor.policy.basestock.BasestockPolicy usa (Sprint 12,
    # uniforme para todo item -- ver EconomicsParams). Tem que ser um dos quantis em
    # model.quantiles abaixo (validado em Params._alpha_bate_com_a_grade_de_quantis).
  category_alpha:
    # NÃO WIREADO (Sprint 12): chaves são placeholders genéricos que NÃO
    # correspondem a Item.category real do subconjunto de trabalho (GROCERY I,
    # DAIRY, etc. -- mesmo problema que category_margin_pct tinha antes do
    # remapeamento da Sprint 8). Nenhuma política lê este dict hoje --
    # BasestockPolicy usa só default_alpha, uniforme, de propósito (ver
    # EconomicsParams: misturar previsão nova com alpha por categoria na mesma
    # sprint destruiria a atribuição do ganho entre os braços). Remapeamento
    # pendente de uma sprint de calibração dedicada. Mesmo inerte, todo valor
    # aqui é validado contra model.quantiles -- um valor fora da grade quebraria
    # compute_order_quantity no instante em que a chave for finalmente ligada.
    hortifruti: 0.80 # arbitrado: perecível, menor alpha pesa menos a ruptura frente à perda
    mercearia: 0.90
    bebidas: 0.90 # corrigido de 0.92 (Sprint 12): 0.92 não é um quantil em model.quantiles
      # abaixo -- ficaria fora da grade e estouraria compute_order_quantity assim que
      # esta chave fosse consumida por alguma política; sem medição nova, 0.90 (o
      # vizinho mais próximo na grade atual) é o valor menos arbitrário disponível
    limpeza: 0.90

# Sprint 13, implementadas em motor.policy.guardrails na Etapa 3.16 (Sprint
# 17) -- até aqui, este bloco nunca tinha sido lido por nenhuma função (ver
# CLAUDE.md, emenda Sprint 17). Decisões de negócio abaixo, não estimadas.
#
# Emenda (Etapa 3.16.2): shelf_life_days_by_category é VALIDADE física, não
# teto de cobertura direto -- o teto efetivo aplicado por
# motor.policy.guardrails.apply_coverage_cap é
# max(validade, lead_time_days + review_period_days). A validade sozinha
# como teto (Etapa 3.16 original) cortava perecível fresco/giro rápido pra
# baixo da própria janela de risco na célula de teste (lt=7/rp=14 -> 21
# dias > validade de 7/14) -- ruptura estrutural garantida, não proteção.
# Os valores abaixo continuam corretos COMO VALIDADE; o que estava errado
# era usá-los sem o piso da janela de risco.
guardrails:
  # Validade por família (dias) -- mesmo agrupamento de família de
  # purchase_list_supplier_assumptions.pack_multiple_by_category, com as
  # duas famílias "mercearia seca" e "bazar/não-alimentar" fundidas (mesma
  # validade de 45 dias para as duas -- giro lento o bastante pra não
  # precisar de validade separada).
  shelf_life_days_by_category:
    # perecível fresco -- estraga rápido, validade apertada
    PRODUCE: 7.0
    MEATS: 7.0
    POULTRY: 7.0
    SEAFOOD: 7.0
    DELI: 7.0
    # giro rápido
    "BREAD/BAKERY": 14.0
    DAIRY: 14.0
    EGGS: 14.0
    "FROZEN FOODS": 14.0
    "PREPARED FOODS": 14.0
    # bebidas
    BEVERAGES: 30.0
    "LIQUOR,WINE,BEER": 30.0
    # mercearia seca e não-alimentar (giro lento, validade larga)
    "GROCERY I": 45.0
    "GROCERY II": 45.0
    CLEANING: 45.0
    "PERSONAL CARE": 45.0
    "HOME CARE": 45.0
    "BABY CARE": 45.0
    "HOME AND KITCHEN I": 45.0
    "HOME AND KITCHEN II": 45.0
    CELEBRATION: 45.0
    "LAWN AND GARDEN": 45.0
    LADIESWEAR: 45.0
    LINGERIE: 45.0
    AUTOMOTIVE: 45.0
    BEAUTY: 45.0
    "PLAYERS AND ELECTRONICS": 45.0
    "SCHOOL AND OFFICE SUPPLIES": 45.0
    "PET SUPPLIES": 45.0
    MAGAZINES: 45.0
    HARDWARE: 45.0
    BOOKS: 45.0
    "HOME APPLIANCES": 45.0
  # Limite de variação: sugestão acima de 2x a média das compras (não
  # vendas) dos últimos 90 dias do item vai para revisão humana --
  # SINALIZADA, não cortada. Item sem histórico de compra suficiente cai na
  # regra de item novo, não nesta (ver motor.policy.guardrails).
  variation_limit_multiple: 2.0
  variation_lookback_days: 90
  # Item novo: menos de 90 dias desde o primeiro registro de venda, OU
  # menos de 30 dias COM venda no histórico -- quantidade fixa (mediana da
  # categoria), nunca por modelo.
  new_item_min_history_days: 90
  new_item_min_days_with_sales: 30
  # Orçamento semanal arbitrado -- Etapa 3.16.3: R$200.000 (valor original)
  # foi calibrado contra um total contaminado pelo teto de cobertura
  # quebrado (~R$497k, que já vinha errado); com o teto corrigido, a
  # necessidade real da política nesta célula é ~R$462k/ciclo de 2 semanas
  # (~R$231k/semana) -- um orçamento de R$200k/semana corta 13,5% do
  # pedido TODA semana, o que não é restrição de caixa, é subfinanciamento
  # crônico (apareceria como ruptura sistemática num cliente real, não
  # como disciplina). Recalibrado para R$250.000/semana (R$500k/ciclo),
  # pouco ACIMA da necessidade típica de R$462k -- critério: a regra deve
  # disparar só em semana atípica (pico de demanda, problema de fluxo de
  # caixa pontual), não toda semana. Fora do orçamento, corte por ordem de
  # margem gerada por real investido (maior margem primeiro), do fim pra
  # trás -- nunca proporcional; ver Etapa 3.16.3 sobre o risco de essa
  # regra, sem piso por categoria, zerar categorias inteiras de baixa
  # margem (achado registrado, correção NÃO implementada ainda).
  weekly_budget_rs: 250000.0
  # Piso de negócio (Etapa 3.16.4): nenhuma categoria cai abaixo desta
  # fração do seu próprio valor originalmente sugerido, qualquer que seja
  # a margem. Sem isso, o corte por margem sozinho zerava categorias
  # inteiras de baixa margem (perecível fresco, mercearia) que são item
  # ÂNCORA por desenho (margem baixa DE PROPÓSITO, pra trazer o cliente à
  # loja) -- 8 de 16 fornecedores zerados/quase-zerados na medição da
  # Etapa 3.16.3. Valor ARBITRADO, critério: preserva presença de gôndola
  # em toda categoria, cortando fundo o suficiente (40%) para a regra
  # ainda ter efeito real -- não é resultado de otimização.
  cash_constraint_category_floor_fraction: 0.60

features:
  # Sprint 14: motor.features.calendar / motor.features.build. Nenhum modelo
  # ainda consome isto -- é a camada de features pra alimentar o LightGBM da
  # Sprint 15, construída e testada contra vazamento antes de existir treino.
  calendar:
    month_start_max_day: 3 # arbitrado
    quinzena_split_day: 15 # convenção de calendário (metade do mês), parametrizado por disciplina, não por incerteza
    payday_days_of_month: [15, -1] # arbitrado: dia 15 e último dia do mês -- convenção comum
      # de folha de pagamento na América Latina; -1 é sentinela de "último dia do mês",
      # nunca 28/30/31 fixo (erraria em fevereiro e em mês de 30 dias)
  historico:
    lag_days: [1, 7, 14, 28] # ontem, mesmo dia da semana passada, duas semanas, quatro semanas
    rolling_windows_days: [7, 14, 28, 56] # múltiplos semanais -- média/proporção nessas janelas
    risk_window_reference_days: 10 # arbitrado, INDEPENDENTE de supplier_assumptions: espelha
      # lead_time_days(3) + review_period_days(7) default de hoje, mas não deriva
      # automaticamente deles -- ver docstring de FeatureHistoricoParams em motor.config
  # Lista exata das colunas emitidas, na ordem -- desliga feature sem mexer no código.
  # Nomes têm que bater com o que build_features de fato calcula a partir de
  # calendar/historico acima (validado em runtime, erro claro se não bater).
  active_features:
    - weekday
    - is_month_start
    - quinzena
    - days_to_payday
    - is_holiday_national
    - is_holiday_regional
    - is_holiday_local
    - lag_units_1
    - lag_units_7
    - lag_units_14
    - lag_units_28
    - rolling_mean_units_7d
    - rolling_mean_units_14d
    - rolling_mean_units_28d
    - rolling_mean_units_56d
    - rolling_sum_units_10d
    - share_days_with_sale_7d
    - share_days_with_sale_14d
    - share_days_with_sale_28d
    - share_days_with_sale_56d
    - promo_share_7d
    - promo_share_14d
    - promo_share_28d
    - promo_share_56d
    - promo_known_share_7d
    - promo_known_share_14d
    - promo_known_share_28d
    - promo_known_share_56d
    - days_since_last_sale
    - days_since_last_promo
    - category
    - item_class
    - is_perishable

model:
  # Estendido na Sprint 16 (0.70 e 0.85 acrescentados) para caber a grade de alpha
  # da varredura de sensibilidade -- economics.default_alpha (e qualquer alpha usado
  # numa célula da varredura) tem que ser um dos valores aqui (Params._alpha_bate_
  # com_a_grade_de_quantis). 0.70 é o ponto que testa a hipótese central da sprint
  # (inversão do resultado em alpha mais baixo); cortar o eixo para caber na grade
  # antiga seria ajustar a pergunta à ferramenta, não medir. Cada booster do braço 3
  # é treinado independente (pinball loss no seu próprio quantil, ver quantile_gbm.py)
  # -- acrescentar dois quantis não pode mudar as previsões dos quatro originais;
  # verificado por regressão contra a Sprint 15 antes de aceitar a extensão.
  quantiles: [0.5, 0.70, 0.80, 0.85, 0.9, 0.95]
  retrain_cadence_days: 7 # semanal, conforme CLAUDE.md seção 8 (re-treino diário é inviável e desnecessário)

quantile_gbm:
  # Sprint 15: motor.forecast.quantile_gbm. Medido antes de implementar (ver
  # relatório da sprint): custo de retreino é desprezível (~1-3 min pro
  # backtest inteiro, 51 retreinos x 4 quantis) -- os hiperparâmetros abaixo
  # não foram escolhidos sob pressão de tempo, só não foram calibrados por
  # grade (fora de escopo desta sprint, sem CV pedido no enunciado).
  learning_rate: 0.05 # arbitrado: moderado, não o 0.1 default nem o 0.03 usado só no diagnóstico de cruzamento
  num_leaves: 31 # arbitrado: default do LightGBM, painel pequeno (dezenas de milhares de linhas) não pede mais
  num_boost_round: 500 # arbitrado: bem acima dos 200 usados no diagnóstico (que já não mudava o cruzamento de quantis)
  num_threads: 1 # fixo por determinismo (CLAUDE.md seção 2) -- não escala com nproc de propósito
  seed: 42 # arbitrado: mesma disciplina de simulation.seed -- importa ser fixo, não qual valor
  # Piso mínimo de origens de treino disponíveis no primeiro retreino do
  # backtest -- erro claro (InsufficientTrainingHistoryError) se não bater,
  # nunca um fit silencioso com poucas origens. Medido: o subconjunto real
  # tem ~52 origens semanais disponíveis ANTES de simulation.start_date
  # (canonical.window_start até lá) -- 8 é um piso confortavelmente abaixo
  # disso, não um número que a configuração atual quase não atinge.
  min_training_origins: 8
  # Janela de treino EXPANSIVA (decisão aprovada, não deslizante) -- a tensão
  # "regime antigo mistura com recente" é resolvida por decaimento de peso
  # por idade da linha, não por encurtar a janela. `null` é o valor NEUTRO:
  # sem decaimento, toda linha pesa igual, resultado byte a byte idêntico a
  # uma janela expansiva sem ponderação -- default deliberado até uma
  # calibração dedicada (Sprint 16) comparar meias-vidas candidatas.
  decay_half_life_days: null
  model_cache_dir: results/model_cache/quantile_gbm # cache por (hash de config, data de retreino) -- nunca só por data

experiments:
  arms:
    - name: erp_baseline
      forecaster: naive
      policy: erp_baseline
    - name: estatistico_basestock
      forecaster: statistical
      policy: basestock
    - name: quantile_gbm_basestock
      forecaster: quantile_gbm
      policy: basestock

canonical:
  # Parâmetros da normalização canônica do Favorita (Sprint 3, motor.io.loaders).
  # window_start/window_end: decidido, reaproveita profiling.windows.ultimos_24_meses
  # (Sprint 2) -- 24 meses, não 12, porque é a única das duas janelas que contém o
  # terremoto do Equador de 2016-04-16 e portanto a única em que is_anomaly chega a
  # ser verdadeiro (D1). Mantida apesar do custo computacional maior.
  window_start: 2015-08-16
  window_end: 2017-08-15
  delisting_gap_days: 90 # arbitrado: distribuição de buraco final vs. buraco interno não separa de forma limpa (D2) -- corte global único, não por categoria/perecibilidade
  fractional_threshold: 0.5 # medido: profile_fractional_by_item mostra separação limpa ~0 vs ~1 nos 4.036 itens do Favorita, só 4 na zona cinzenta (D5)
  anomalies:
    - name: terremoto_equador_2016
      start: 2016-04-16 # medido: volume diário nacional sobe de ~650-700k/dia para pico de 1,35M em 2016-04-18
      end: 2016-04-24 # medido: volume diário nacional volta à faixa de base (~680k) em 2016-04-25
      reason: "Terremoto M7.8 no Equador em 16/04/2016; pico de compra de emergência em 49 das 54 lojas"

client_loader:
  # Sprint 22: motor.io.loaders_cliente (dado de cliente real). Tudo arbitrado ate o
  # primeiro cliente: sao premissas a confirmar na entrevista, nao medicoes.
  principal_supplier_window_days: 90 # DC6: janela, ancorada na ultima nota dos dados, para escolher o fornecedor principal do item
  generic_codes: ["9999"] # DC3: codigos de venda generica ("diversos") -- confirmar com o cliente
  generic_description_patterns: ["DIVERSOS"] # DC3: descricao (caixa alta) que marca venda generica
  generic_revenue_share_warn: 0.05 # arbitrado: acima disso o dado nao serve para reposicao (perfil)
  emergency_name_patterns: ["ATACAREJO", "ATACAD", "CASH"] # DC7: trechos do nome do emitente (caixa alta); `tipo` explicito no arquivo de fornecedores vence
  emergency_cnae_prefixes: ["4639", "4691"] # DC7: prefixos de CNAE de atacado -- a validar com o cliente; a tag CNAE do emitente e opcional na NF-e
  emergency_warn_max_notes: 2 # DC7: fornecedor ausente do arquivo da entrevista com ate N notas na janela vira AVISO no perfil (nunca muda a classificacao)
  cost_divergence_tolerance: 0.10 # arbitrado: custo de cadastro vs ultima nota; abaixo disso nao e achado da auditoria
  idle_days_threshold: 90 # arbitrado: dias sem venda com saldo positivo para entrar na auditoria
  default_shelf_life_days: 365 # arbitrado: validade de item sem `validade_dias` no cadastro e nao perecivel
  default_perishable_shelf_life_days: 7 # arbitrado: conservador; item perecivel sem `validade_dias` entra na auditoria
  simulation_start_after_days: 84 # arbitrado: 12 semanas de historico antes do 1o dia do simulador (so o modo demo, sem saldo de estoque, roda o simulador)
  weekly_budget_rs: null # sem orcamento informado a restricao de caixa fica DESLIGADA no modo canonical (declarado na aba Notas)
